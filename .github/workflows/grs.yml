name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Thumbsplit58 card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=mohammedari&repo=thumbsplit58-hardware
          path: profile/pin-thumbsplit58-hardware.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CNCjs pendant bridge card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=mohammedari&repo=cncjs-pendant-python-bridge
          path: profile/pin-cncjs-pendant-python-bridge.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate TensorFlow Object Detector card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=mohammedari&repo=tensorflow_object_detector_ros
          path: profile/pin-tensorflow_object_detector_ros.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate OpenGL ROS card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=mohammedari&repo=opengl_ros
          path: profile/pin-opengl_ros.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update README cards"
          git push
